<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tennis Ball Riot">
  <meta name="description" content="A front-row arcade game. Time your throw, dodge the singer and land a tennis ball in the drummer’s pint.">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preload" href="/fonts/barlow-condensed-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/src/style.css">
  <title>Iggy Pop · Tennis Ball Riot</title>
</head>
<body data-screen="title">
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true"><defs>
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M4 7c6 1 8 5 7 14M13 3c-1 7 2 11 8 13"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 4.4 1.6c-1.1.9-1.9 1.4-1.9 2.7M12 17h.01"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 3 14 9-14 9z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h8m4 0h6M3 12h2m4 0h12M3 18h10m4 0h4"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="15" cy="18" r="2"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3zM17 9l5 6m0-6-5 6"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5c0 4-2 6-5 6s-5-2-5-6zM7 6H3v2c0 3 2 5 5 5m9-7h4v2c0 3-2 5-5 5M12 15v4m-4 2h8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </defs></svg>
  <main id="game">
    <canvas id="stage" role="img" aria-label="A rock concert stage, with a pint glass beside the drummer to the right"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <div id="title">
      <header class="utility">
        <div class="record"><svg class="ico"><use href="#i-trophy"/></svg><span>Personal best <b id="title-best">0</b></span></div>
        <div class="tools"><button class="icon-button" id="title-mute" aria-label="Mute sound"><svg class="ico"><use href="#i-audio"/></svg></button><button class="icon-button" id="title-settings" aria-label="Settings"><svg class="ico"><use href="#i-settings"/></svg></button></div>
      </header>
      <section class="cover" aria-labelledby="title-name">
        <div class="wordmark">
          <span class="artist">Iggy Pop</span>
          <h1 id="title-name"><span>Tennis Ball</span><strong>Riot!</strong></h1>
        </div>
        <div class="title-actions">
          <p>Land a tennis ball in the drummer’s pint.</p>
          <div class="play-row"><button class="primary" id="play" disabled><svg class="ico"><use href="#i-play"/></svg> Play now</button><button class="secondary" id="help"><svg class="ico"><use href="#i-help"/></svg> How to play</button></div>
          <div id="load-line" role="status"><progress id="load-meter" max="100" value="0"></progress><span id="load-label">Tuning up…</span></div>
        </div>
      </section>
    </div>
    <section id="hud" aria-label="Game controls" hidden>
      <div class="hud-top">
        <div class="set"><span id="song-count">Song 01 / 10</span><b id="song">Sound Check</b><small id="streak" hidden></small></div>
        <div class="score"><span>Score</span><b id="points">0</b><small id="best-in-play">Best 0</small></div>
        <button class="icon-button" id="pause" aria-label="Pause game"><svg class="ico"><use href="#i-pause"/></svg></button>
      </div>
      <div id="throw-area" tabindex="0" role="group" aria-label="Throwing area. Drag up and right toward the pint. Keyboard: arrows adjust aim and power, Space throws, Escape pauses."></div>
      <div class="readouts">
        <div class="status-chip"><svg class="ico"><use href="#i-ball"/></svg><span><b id="stock">10</b> balls left</span></div>
        <div class="status-chip"><span><b id="target">0 / 1</b> in the pint</span></div>
      </div>
      <div class="lower">
        <div id="teaching" class="teaching"><span class="swipe" aria-hidden="true">↗</span><span><b>Drag up and right</b><small>Release to throw into the pint.</small><small class="keys">Arrow keys to aim · Space to throw</small></span></div>
        <div id="aim-controls" hidden>
          <label for="angle">Angle <output id="angle-out">60°</output></label><input type="range" id="angle" min="15" max="85" value="60">
          <label for="power">Power <output id="power-out">70%</output></label><input type="range" id="power" min="0" max="100" value="70">
          <button id="throw" class="primary">Throw ball</button>
        </div>
        <div id="aim-readout" hidden></div>
      </div>
      <output id="surge" hidden></output><output id="feedback" aria-live="polite" hidden></output>
    </section>
  </main>
  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close" class="icon-button" aria-label="Close"><svg class="ico"><use href="#i-close"/></svg></button></div>
    <div id="panel-content"></div>
  </dialog>
  <div id="announce" class="sr" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
